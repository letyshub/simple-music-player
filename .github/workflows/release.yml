name: wydanie

# Pchnięcie tagu w rodzaju v1.2.0 buduje instalator i wersję przenośną,
# a potem podczepia je pod szkic wydania na GitHubie. Szkic, a nie gotowe
# wydanie, bo zły plik wykonywalny trudniej cofnąć niż zły commit — ktoś
# powinien go najpierw uruchomić i dopiero wtedy kliknąć „publish".
on:
  push:
    tags:
      - 'v*'
  # Ręczne uruchomienie do sprawdzenia, czy sam pipeline działa,
  # bez zakładania tagu.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron to ponad sto megabajtów pobierane przy każdym budowaniu.
      # Cache oszczędza kilka minut na wydanie.
      - name: Cache narzędzi electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - run: npm ci

      # Tag i wersja w package.json muszą się zgadzać, inaczej wydanie
      # v1.2.0 zawierałoby pliki nazwane 1.1.0 i nikt by tego nie zauważył
      # aż do zgłoszenia od użytkownika.
      - name: Sprawdź zgodność tagu z wersją w package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME nie zgadza sie z wersja $pkg w package.json."
            exit 1
          fi
          echo "Tag i wersja zgodne: $pkg"

      # Opis wydania powstaje z CHANGELOG.md. Krok kończy się błędem, gdy
      # dla wydawanej wersji nikt nie napisał opisu — lepiej przerwać teraz
      # niż opublikować instalator z pustą stroną wydania.
      - name: Przygotuj opis wydania z CHANGELOG.md
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          node tools/release-notes.mjs "$version" build/release-notes.md
          echo "--- opis wydania $version ---"
          cat build/release-notes.md

      # Testy jednostkowe są bramką. Test dymny zostaje poza pipeline'em,
      # bo potrzebuje karty dźwiękowej, a bramka, która czasem zapala się
      # na czerwono bez powodu, szybko przestaje cokolwiek znaczyć.
      - run: npm test

      - name: Zbuduj i wyślij do szkicu wydania
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uruchomienie ręczne jest suchym przebiegiem: sprawdza, czy pipeline
      # i budowanie działają, ale nie zakłada nikomu szkicu wydania.
      - name: Zbuduj bez publikowania (uruchomienie ręczne)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      # Kopia plików przy przebiegu, żeby dało się je pobrać i sprawdzić
      # także wtedy, gdy pipeline uruchomiono ręcznie, bez tagu.
      - name: Zachowaj zbudowane pliki
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
