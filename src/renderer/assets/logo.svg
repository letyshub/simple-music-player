<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Simple Music Player">
  <title>Simple Music Player</title>

  <!--
    Five level bars on a dark plate. The vertical gradient runs green at the
    bottom through amber to red at the top, so a bar shows more colour the
    higher it reaches, exactly like the spectrum analyser on the deck. The
    caps are rounded so the mark reads as audio levels rather than a chart.
  -->

  <defs>
    <linearGradient id="smp-led" x1="0" y1="9" x2="0" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.2" stop-color="#fbbf24"/>
      <stop offset="0.48" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="smp-plate" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#0d1114"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#smp-plate)"/>
  <rect x="0.9" y="0.9" width="62.2" height="62.2" rx="13.1" fill="none" stroke="#333c46" stroke-width="1.8"/>

  <g fill="url(#smp-led)">
    <rect x="6"  y="23" width="8" height="18" rx="4"/>
    <rect x="17" y="15" width="8" height="34" rx="4"/>
    <rect x="28" y="9"  width="8" height="46" rx="4"/>
    <rect x="39" y="18" width="8" height="28" rx="4"/>
    <rect x="50" y="25" width="8" height="15" rx="4"/>
  </g>
</svg>
